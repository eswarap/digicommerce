name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Login to Amazon ECR Public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Deploy infrastructure if not exists
      run: |
        if ! aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
          echo "Infrastructure stack not found, deploying..."
          aws cloudformation deploy \
            --template-file aws-deployment/infrastructure.yaml \
            --stack-name digicommerce-infrastructure \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM
        else
          echo "Infrastructure stack already exists"
        fi

    - name: Get ECR repository URIs
      id: ecr-uris
      run: |
        USER_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='UserServiceRepository'].OutputValue" --output text --region ${{ env.AWS_REGION }})
        ORDER_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='OrderServiceRepository'].OutputValue" --output text --region ${{ env.AWS_REGION }})
        TOKEN_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='TokenServiceRepository'].OutputValue" --output text --region ${{ env.AWS_REGION }})
        ORCHESTRATION_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='OrchestrationServiceRepository'].OutputValue" --output text --region ${{ env.AWS_REGION }})
        
        echo "user-repo=$USER_REPO" >> $GITHUB_OUTPUT
        echo "order-repo=$ORDER_REPO" >> $GITHUB_OUTPUT
        echo "token-repo=$TOKEN_REPO" >> $GITHUB_OUTPUT
        echo "orchestration-repo=$ORCHESTRATION_REPO" >> $GITHUB_OUTPUT

    - name: Build and push Docker images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build and push user-service
        docker build -t ${{ steps.ecr-uris.outputs.user-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=user-service .
        docker push ${{ steps.ecr-uris.outputs.user-repo }}:$IMAGE_TAG
        
        # Build and push order-service
        docker build -t ${{ steps.ecr-uris.outputs.order-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=order-service .
        docker push ${{ steps.ecr-uris.outputs.order-repo }}:$IMAGE_TAG
        
        # Build and push token-service
        docker build -t ${{ steps.ecr-uris.outputs.token-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=token-service .
        docker push ${{ steps.ecr-uris.outputs.token-repo }}:$IMAGE_TAG
        
        # Build and push orchestration-service
        docker build -t ${{ steps.ecr-uris.outputs.orchestration-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=orchestration-service .
        docker push ${{ steps.ecr-uris.outputs.orchestration-repo }}:$IMAGE_TAG

    - name: Deploy ECS services if not exists
      run: |
        if ! aws cloudformation describe-stacks --stack-name digicommerce-services --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
          echo "Services stack not found, deploying..."
          aws cloudformation deploy \
            --template-file aws-deployment/services.yaml \
            --stack-name digicommerce-services \
            --parameter-overrides InfrastructureStackName=digicommerce-infrastructure \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM
        else
          echo "Services stack already exists"
        fi

    - name: Update ECS services
      run: |
        # Check if services exist and update them
        CLUSTER_NAME="DigiCommerce-Cluster"
        SERVICES=("user-service" "order-service" "token-service" "orchestration-service")
        
        for service in "${SERVICES[@]}"; do
          if aws ecs describe-services --cluster $CLUSTER_NAME --services $service --query 'services[0].status' --output text --region ${{ env.AWS_REGION }} 2>/dev/null | grep -q "ACTIVE"; then
            echo "Updating $service..."
            aws ecs update-service --cluster $CLUSTER_NAME --service $service --force-new-deployment --region ${{ env.AWS_REGION }}
          else
            echo "Service $service not found or not active, skipping update"
          fi
        done