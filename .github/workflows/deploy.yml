name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Login to Amazon ECR Public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Get ECR repository URIs
      id: ecr-uris
      run: |
        USER_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='UserServiceRepository'].OutputValue" --output text)
        ORDER_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='OrderServiceRepository'].OutputValue" --output text)
        TOKEN_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='TokenServiceRepository'].OutputValue" --output text)
        ORCHESTRATION_REPO=$(aws cloudformation describe-stacks --stack-name digicommerce-infrastructure --query "Stacks[0].Outputs[?OutputKey=='OrchestrationServiceRepository'].OutputValue" --output text)
        
        echo "user-repo=$USER_REPO" >> $GITHUB_OUTPUT
        echo "order-repo=$ORDER_REPO" >> $GITHUB_OUTPUT
        echo "token-repo=$TOKEN_REPO" >> $GITHUB_OUTPUT
        echo "orchestration-repo=$ORCHESTRATION_REPO" >> $GITHUB_OUTPUT

    - name: Build and push Docker images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build and push user-service
        docker build -t ${{ steps.ecr-uris.outputs.user-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=user-service .
        docker push ${{ steps.ecr-uris.outputs.user-repo }}:$IMAGE_TAG
        
        # Build and push order-service
        docker build -t ${{ steps.ecr-uris.outputs.order-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=order-service .
        docker push ${{ steps.ecr-uris.outputs.order-repo }}:$IMAGE_TAG
        
        # Build and push token-service
        docker build -t ${{ steps.ecr-uris.outputs.token-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=token-service .
        docker push ${{ steps.ecr-uris.outputs.token-repo }}:$IMAGE_TAG
        
        # Build and push orchestration-service
        docker build -t ${{ steps.ecr-uris.outputs.orchestration-repo }}:$IMAGE_TAG -f Dockerfile --build-arg SERVICE_PATH=orchestration-service .
        docker push ${{ steps.ecr-uris.outputs.orchestration-repo }}:$IMAGE_TAG

    - name: Update ECS services
      run: |
        # Force new deployment of ECS services to pick up new images
        aws ecs update-service --cluster digicommerce-cluster --service user-service --force-new-deployment
        aws ecs update-service --cluster digicommerce-cluster --service order-service --force-new-deployment
        aws ecs update-service --cluster digicommerce-cluster --service token-service --force-new-deployment
        aws ecs update-service --cluster digicommerce-cluster --service orchestration-service --force-new-deployment