AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    Runtime: java17
    MemorySize: 512

Resources:
  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type,authorization'"
        AllowOrigin: "'*'"

  # Token Service Lambda
  TokenServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: token-lambda/
      Handler: org.woven.digicommerce.tokenservice.lambda.TokenHandler::handleRequest
      Environment:
        Variables:
          JWT_SECRET: your-secret-key-here
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/auth/login
            Method: post
        ValidateApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/auth/validate
            Method: post
        LogoutApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/auth/logout
            Method: post

  # Notification Service Lambda
  NotificationServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: notification-lambda/
      Handler: org.woven.digicommerce.notification.lambda.NotificationHandler::handleRequest
      Events:
        SendNotificationApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/notifications/send
            Method: post
        GetNotificationsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/notifications
            Method: get

  # DynamoDB Table for Token Storage
  TokenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tokens
      AttributeDefinitions:
        - AttributeName: tokenId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # DynamoDB Table for Notifications
  NotificationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: notifications
      AttributeDefinitions:
        - AttributeName: notificationId
          AttributeType: S
      KeySchema:
        - AttributeName: notificationId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

Outputs:
  ApiGatewayUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/"